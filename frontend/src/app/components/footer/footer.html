<footer class="border-t border-white/10 bg-[#08090D]">
  <div class="mx-auto max-w-7xl px-6 py-10 md:py-12">

    <div class="grid gap-10 md:grid-cols-4">

      <!-- Brand -->
      <div class="md:col-span-2">
        <a href="#home" class="inline-flex items-center">
          <img
            src="/exp.svg"
            alt="SBG"
            class="h-24 w-auto object-contain"
          />
        </a>

        <p class="mt-4 max-w-md text-sm leading-6 text-white/50">
          A student-driven community focused on building real systems,
          exploring cloud technologies, and turning ideas into working
          products.
        </p>
      </div>

      <!-- Navigation -->
      <div>
        <h3 class="text-sm font-semibold text-white">
          Navigation
        </h3>

        <nav class="mt-4 flex flex-col gap-2.5">
          <a href="#home" class="w-fit text-sm text-white/50 transition-colors hover:text-white">
            Home
          </a>
          <a href="#about" class="w-fit text-sm text-white/50 transition-colors hover:text-white">
            About
          </a>
          <a href="#events" class="w-fit text-sm text-white/50 transition-colors hover:text-white">
            Events
          </a>
          <a href="#resources" class="w-fit text-sm text-white/50 transition-colors hover:text-white">
            Resources
          </a>
          <a href="#team" class="w-fit text-sm text-white/50 transition-colors hover:text-white">
            Team
          </a>
        </nav>
      </div>

      <!-- Community -->
      <div>
        <h3 class="text-sm font-semibold text-white">
          Community
        </h3>

        <div class="mt-6 flex items-center gap-5">
          <a
            href="https://chat.whatsapp.com/In2w5QxicrB6fuLzV3fL2y"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="whatsapp"
            class="text-white/40 transition-all duration-300 hover:-translate-y-1 hover:text-white"
          >
            <fa-icon [icon]="faWhatsapp" class="text-lg" />
          </a>

          <a
            href="https://www.linkedin.com/company/aws-student-builder-group-at-gcect"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
            class="text-white/40 transition-all duration-300 hover:-translate-y-1 hover:text-white"
          >
            <fa-icon [icon]="faLinkedin" class="text-lg" />
          </a>

          <a
            href="https://www.meetup.com/aws-sbg-at-government-college-of-eng-ceramic-tech-kolkata/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Meetup"
            class="text-white/40 transition-all duration-300 hover:-translate-y-1 hover:text-white"
          >
            <fa-icon [icon]="faMeetup" class="text-lg" />
          </a>
        </div>
      </div>

    </div>

    <!-- Bottom -->
    <div
      class="mt-10 flex w-full flex-col gap-3 border-t border-white/10 pt-5 text-sm text-white/40 md:flex-row md:items-center md:justify-between"
    >
      <p>
        © 2026 AWS Student Builder Group at GCECT
      </p>

      <p>
        Built by students, for students.
      </p>
